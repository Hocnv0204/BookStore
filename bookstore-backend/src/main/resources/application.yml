server:
  port: 8080

spring:
  application:
    api-prefix: /api/v1
  profiles:
    active: dev

  datasource:
    url: jdbc:mysql://bookstore_db:3306/bookstore_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

  jwt:
    signerKey: ${JWT_SIGNER_KEY}
    valid-duration: 1800000
    refreshable-duration: 604800

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

cloudinary:
  cloud_name: ${CLOUDINARY_CLOUD_NAME}
  api_key: ${CLOUDINARY_API_KEY}
  api_secret: ${CLOUDINARY_API_SECRET}

file:
  upload-dir: uploads
  allowed-extensions: .jpg,.jpeg,.png,.gif
  max-file-size: 5242880

logging:
  level:
    org.springframework: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

gemini:
  api-key: ${GEMINI_API_KEY}
  base-url: https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent
  max-output-tokens: 1000
  temperature: 0.1
  top-p: 0.8
  top-k: 10
  max-history-size: 20

payment:
  vnPay:
    url: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
    tmnCode: ${TMN_CODE}
    secretKey: ${VNPAY_SECRET_KEY}
    returnUrl: http://localhost:3000/payment/callback
    version: 2.1.0
    command: pay
    orderType: other
